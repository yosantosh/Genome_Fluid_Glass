# Blur-my-Shell state for the dock path (v74, GNOME 50.1).
# Dock + popup blur OFF — glass comes from the shader, not BMS.
# Panel blur/override was ON (brightness 0.5) and caused the top-bar dark
# band; the new pack turns it OFF (see shell/.../schemas).
[/]
rounded-blur-found=true
settings-version=2

[dash-to-dock]
blur=false
brightness=0.9
corner-radius=22
override-background=false
sigma=35
static-blur=false
style-dash-to-dock=0

[panel]
blur=false
brightness=0.5
corner-radius=0
override-background=false
sigma=30
static-blur=true

[popup]
blur=false
